plugins {
    id 'com.android.application'
}

android {
    // NOTE: The Java package remains `com.xenia.android` for ABI/JNI
    // compatibility with the native `Java_com_xenia_android_*` symbols
    // compiled into libxeo.so. The user-facing Application ID below is
    // `org.adars.xeo` and may differ from the namespace — this is the
    // AGP-recommended pattern for renamed forks.
    namespace 'com.xenia.android'
    compileSdk 35

    // Pin the exact NDK version. AGP 8.2+ warns if ndkVersion is absent
    // when externalNativeBuild is configured.
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'org.adars.xeo'
        // API 24 = Android 7.0, minimum for Vulkan 1.0
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "0.5.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                // C++20, exceptions and RTTI required by Xenia
                cppFlags "-std=c++20 -frtti -fexceptions"
                // STL: static c++ runtime so we don't ship libc++_shared.so
                arguments(
                    "-DANDROID_STL=c++_static",
                    "-DANDROID_PLATFORM=android-24",
                    "-DANDROID_ARM_NEON=TRUE",
                    "-DXENIA_BUILD_ANDROID=ON",
                    "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384"
                )
            }
        }

        ndk {
            // arm64-v8a: phones/tablets. x86_64: Android emulator / dev boxes.
            // 32-bit ABIs are unsupported — Xenia's JIT requires 64-bit address space.
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
            jniDebuggable true
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Debug"
                }
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
            // Production signing: drop a `keystore.properties` file next to
            // this build.gradle (see keystore.properties.example) and uncomment
            // the block below to sign release builds for distribution.
            //
            // signingConfig signingConfigs.release
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            // AGP 8.x requires an explicit CMake version
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        jniLibs {
            // Keep native debug symbols in the APK for crash reporting
            keepDebugSymbols += ['**/*.so']
        }
    }
}

// ---------------------------------------------------------------------------
// Optional production signing config.
// Enable by creating `keystore.properties` (see keystore.properties.example)
// in the app/ directory. When absent, release builds fall back to the debug
// signing config — useful for CI but NOT for Play Store distribution.
// ---------------------------------------------------------------------------
def keystorePropertiesFile = rootProject.file('app/keystore.properties')
if (keystorePropertiesFile.exists()) {
    def keystoreProperties = new Properties()
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    android.signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }
    android.buildTypes.release.signingConfig = android.signingConfigs.release
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.4'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
